<!DOCTYPE html>
<html class="dark" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tx — telegraph wire</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link crossorigin href="https://fonts.gstatic.com" rel="preconnect" />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Space+Mono:ital,wght@0,400;0,700;1,700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body
    class="bg-[#090a0d] dark-vignette text-[#f0f2f5] font-sans h-screen w-screen flex flex-col justify-between overflow-hidden antialiased selection:bg-[#ffbe44]/20 selection:text-[#ffbe44]"
    style="background-color: rgb(7, 9, 11)"
  >
    <!-- Ambient Background Overlays -->
    <div
      aria-hidden="true"
      class="fixed inset-0 pointer-events-none z-0 overflow-hidden"
    >
      <div
        class="absolute inset-0 bg-cover bg-no-repeat bg-bottom"
        style="
          background-image: url(&quot;assets/bg.jpg&quot;);
          filter: blur(4px);
          transform: scale(1.06);
          transform-origin: center center 0px;
        "
      ></div>
      <div
        class="absolute inset-0"
        style="
          background: radial-gradient(
            85% 90% at 50% 88%,
            rgba(16, 20, 27, 0.45) 0%,
            rgba(10, 12, 16, 0.72) 50%,
            rgba(7, 9, 11, 0.92) 80%,
            rgb(7, 9, 11) 100%
          );
        "
      ></div>
    </div>
    <div
      aria-hidden="true"
      class="fixed inset-0 pointer-events-none z-0 bg-[#07090b]/85 backdrop-blur-md"
      style="
        mask-image: radial-gradient(
          80% 90% at 50% 88%,
          rgba(0, 0, 0, 0.15) 0%,
          rgba(0, 0, 0, 0.45) 46%,
          rgba(0, 0, 0, 0.82) 78%,
          rgba(0, 0, 0, 0.95) 100%
        );
        background: radial-gradient(
          circle at 50% 80%,
          rgba(5, 7, 9, 0.35) 0%,
          rgba(7, 9, 11, 0.88) 100%
        );
      "
    ></div>

    <!-- Station Entry Landing Screen -->
    <main
      id="station-landing-view"
      class="relative z-10 w-full min-h-screen flex flex-col items-center justify-center p-4"
    >
      <div class="flex flex-col items-center select-none w-full max-w-md">
        <div class="flex items-center justify-center mb-8 text-center">
          <h1
            class="text-6xl sm:text-7xl font-black font-['Outfit'] tracking-tight text-white flex items-baseline leading-none"
          >
            tx<span class="relative inline-flex items-baseline"
              ><span
                class="relative text-[#ffc665] leading-none inline-block z-10"
                style="
                  text-shadow:
                    0 0 10px #ffc665,
                    0 0 24px #e5a93c,
                    0 0 42px rgba(229, 169, 60, 0.95),
                    0 0 60px rgba(245, 158, 11, 0.8);
                "
                >.</span
              ><span
                class="absolute left-1/2 bottom-[0.16em] -translate-x-1/2 translate-y-1/2 w-16 h-16 rounded-full pointer-events-none z-0"
                style="
                  background: radial-gradient(
                    circle,
                    rgba(229, 169, 60, 0.95) 0%,
                    rgba(229, 169, 60, 0.55) 35%,
                    rgba(229, 169, 60, 0) 75%
                  );
                  filter: blur(6px);
                "
              ></span
            ></span>
          </h1>
        </div>
        <div
          class="w-full bg-black/55 backdrop-blur-md rounded-2xl p-7 shadow-2xl flex flex-col gap-5 relative border border-white/10"
        >
          <div class="flex flex-col gap-3.5">
            <div
              class="group flex items-center gap-3.5 bg-zinc-900/85 rounded-xl px-4 py-3.5 border border-transparent focus-within:border-[#e5a93c]/60 focus-within:shadow-[0_0_14px_rgba(229,169,60,0.2)] transition-all"
            >
              <svg
                class="w-6 h-6 flex-shrink-0 text-white group-focus-within:text-[#e5a93c] transition-colors"
                fill="none"
                stroke="currentColor"
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2.5"
                viewBox="0 0 24 24"
              >
                <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
              <input
                id="callsign-input"
                class="w-full bg-transparent text-white group-focus-within:text-[#e5a93c] placeholder:text-zinc-500 font-['Outfit'] font-semibold text-base sm:text-[17px] tracking-wide focus:outline-none lowercase transition-colors border-none p-0 focus:ring-0"
                maxlength="16"
                placeholder="callsign"
                type="text"
                value="stn-74"
              />
            </div>
            <div
              class="group flex items-center gap-3.5 bg-zinc-900/85 rounded-xl px-4 py-3.5 border border-transparent focus-within:border-[#e5a93c]/60 focus-within:shadow-[0_0_14px_rgba(229,169,60,0.2)] transition-all"
            >
              <svg
                class="w-6 h-6 flex-shrink-0 text-white group-focus-within:text-[#e5a93c] transition-colors"
                fill="none"
                stroke="currentColor"
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2.5"
                viewBox="0 0 24 24"
              >
                <line x1="4" x2="20" y1="9" y2="9"></line>
                <line x1="4" x2="20" y1="15" y2="15"></line>
                <line x1="10" x2="8" y1="3" y2="21"></line>
                <line x1="16" x2="14" y1="3" y2="21"></line>
              </svg>
              <input
                id="room-input"
                class="w-full bg-transparent text-white group-focus-within:text-[#e5a93c] placeholder:text-zinc-500 font-['Outfit'] font-semibold text-base sm:text-[17px] tracking-wide focus:outline-none lowercase transition-colors border-none p-0 focus:ring-0"
                maxlength="16"
                placeholder="channel"
                type="text"
                value="wire-01"
              />
              <button
                id="randomize-btn"
                aria-label="randomize channel"
                class="text-white hover:text-[#e5a93c] transition-colors flex items-center justify-center p-1 active:scale-95 rounded-md hover:bg-white/5 cursor-pointer"
                title="randomize channel"
                type="button"
              >
                <svg
                  class="w-5 h-5 text-white hover:text-[#e5a93c] transition-colors"
                  fill="none"
                  stroke="currentColor"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2.5"
                  viewBox="0 0 24 24"
                >
                  <polyline points="16 3 21 3 21 8"></polyline>
                  <line x1="4" x2="21" y1="20" y2="3"></line>
                  <polyline points="21 16 21 21 16 21"></polyline>
                  <line x1="15" x2="21" y1="15" y2="21"></line>
                  <line x1="4" x2="9" y1="4" y2="9"></line>
                </svg>
              </button>
            </div>
          </div>

          <div
            id="landing-error"
            class="hidden text-rose-400 font-mono text-xs text-center font-semibold -mt-1 lowercase"
          ></div>

          <div class="flex items-center justify-between pt-1">
            <button
              id="toggle-cipher-btn"
              aria-label="toggle cipher guide"
              class="w-11 h-11 flex items-center justify-center text-white hover:text-[#e5a93c] hover:bg-white/5 rounded-xl active:scale-95 transition cursor-pointer bg-transparent border-none p-0"
              title="morse cipher sheet"
              type="button"
            >
              <svg
                class="w-7 h-7 stroke-current"
                fill="none"
                stroke="currentColor"
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2.3"
                viewBox="0 0 24 24"
              >
                <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                <path
                  d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"
                ></path>
                <line x1="8" x2="16" y1="7" y2="7"></line>
                <line x1="8" x2="13" y1="11" y2="11"></line>
              </svg>
            </button>
            <button
              id="connect-btn"
              aria-label="enter station"
              class="bg-gradient-to-br from-amber-400 to-amber-600 rounded-full w-14 h-14 flex items-center justify-center shadow-lg active:scale-95 hover:scale-105 transition cursor-pointer"
              style="box-shadow: 0 0 24px rgba(229, 169, 60, 0.45)"
              type="button"
            >
              <svg
                id="connect-icon"
                class="w-7 h-7 text-white stroke-current drop-shadow-[0_1px_2px_rgba(0,0,0,0.5)]"
                fill="none"
                stroke="currentColor"
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="3"
                viewBox="0 0 24 24"
              >
                <line x1="5" x2="19" y1="12" y2="12"></line>
                <polyline points="12 5 19 12 12 19"></polyline>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </main>

    <!-- Active Telegraph Deck -->
    <div
      id="wire-active-view"
      class="hidden h-screen w-screen flex-col justify-between overflow-hidden"
    >
      <!-- Header -->
      <header
        class="fixed top-0 left-0 right-0 z-30 flex items-center justify-between px-7 py-5 bg-gradient-to-b from-[#090a0d] via-[#090a0d]/90 to-transparent pointer-events-none"
      >
        <div class="pointer-events-auto flex items-center gap-2">
          <span
            class="font-sans font-black text-xl tracking-tight text-[#f0f2f5] select-none"
            >tx<span class="text-[#ffbe44]">.</span></span
          >
        </div>
        <div class="pointer-events-auto flex items-center gap-3">
          <button
            id="toggle-cheat"
            aria-label="Alphabet sheet"
            class="w-10 h-10 flex items-center justify-center text-[#cbd3de] hover:text-[#ffbe44] transition-all active:scale-95 cursor-pointer"
            title="Alphabet Sheet"
          >
            <svg
              class="w-6 h-6"
              fill="none"
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2.75"
              viewBox="0 0 24 24"
            >
              <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
              <path
                d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"
              ></path>
              <line
                stroke-dasharray="1.5 2"
                stroke-width="2.8"
                x1="8"
                x2="16"
                y1="8"
                y2="8"
              ></line>
              <line
                stroke-dasharray="3 2"
                stroke-width="2.8"
                x1="8"
                x2="14"
                y1="12"
                y2="12"
              ></line>
            </svg>
          </button>
          <button
            id="toggle-sfx"
            aria-label="Toggle sound frequency"
            class="w-10 h-10 flex items-center justify-center text-[#cbd3de] hover:text-[#ffbe44] transition-all active:scale-95 cursor-pointer"
            title="Audio Oscillator"
          >
            <svg
              id="sfx-icon"
              class="w-6 h-6"
              fill="none"
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2.75"
              viewBox="0 0 24 24"
            >
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
              <path class="sfx-wave" d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
              <path class="sfx-wave" d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
            </svg>
          </button>
          <button
            id="toggle-settings"
            aria-label="Station settings"
            class="w-10 h-10 flex items-center justify-center text-[#cbd3de] hover:text-[#ffbe44] transition-all active:scale-95 cursor-pointer"
            title="Settings"
          >
            <svg
              class="w-6 h-6"
              fill="none"
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2.5"
              viewBox="0 0 24 24"
            >
              <circle cx="12" cy="12" r="3"></circle>
              <path
                d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"
              ></path>
            </svg>
          </button>
        </div>
      </header>

      <!-- Chat Feed Stream -->
      <main
        class="w-full max-w-3xl mx-auto flex-1 flex flex-col justify-end px-6 sm:px-10 pt-20 pb-4 overflow-hidden z-10"
      >
        <div
          id="chat-stream"
          class="w-full flex-1 flex flex-col justify-end space-y-7 overflow-y-auto pr-1 py-4 scroll-smooth"
        ></div>
      </main>

      <!-- Bottom Telegraph Deck -->
      <footer
        class="w-full relative shrink-0 z-20"
        style="background: transparent"
      >
        <div class="w-full max-w-4xl mx-auto px-4 sm:px-8 pb-3 pt-2">
          <div
            class="w-full rounded-2xl relative overflow-hidden select-none flex flex-col"
            style="
              background: linear-gradient(
                135deg,
                rgba(255, 255, 255, 0.08) 0%,
                rgba(20, 24, 33, 0.45) 100%
              );
              backdrop-filter: blur(20px) saturate(180%);
              border: 1px solid rgba(255, 255, 255, 0.12);
              box-shadow:
                rgba(255, 255, 255, 0.2) 0px 1px 1px 0px inset,
                rgba(0, 0, 0, 0.5) 0px 12px 32px -4px;
            "
          >
            <div
              class="w-full px-6 sm:px-8 pt-4 pb-2 flex items-center justify-between gap-6 border-b border-white/[0.04]"
            >
              <div class="flex flex-col gap-1 min-w-0 flex-1">
                <div
                  class="flex items-center gap-3 overflow-x-auto whitespace-nowrap"
                >
                  <span
                    class="text-[#8a92a0] text-xs font-mono font-extrabold select-none tracking-tight flex items-center shrink-0 w-5 justify-center opacity-70"
                    title="Morse Code"
                    >·—</span
                  >
                  <div
                    id="morse-buffer"
                    class="font-mono text-sm tracking-[0.32em] text-[#ffbe44] font-bold min-h-[18px] flex items-center drop-shadow-[0_0_8px_rgba(255,190,68,0.3)]"
                  ></div>
                  <span
                    id="cursor-indicator"
                    class="w-1.5 h-3.5 bg-[#ffbe44] inline-block cursor-blink"
                  ></span>
                </div>
                <div
                  id="decoded-live-row"
                  class="flex items-center gap-3 overflow-x-auto whitespace-nowrap"
                >
                  <span
                    class="text-[#8a92a0] text-xs font-sans font-black select-none tracking-tight shrink-0 w-5 text-center leading-none opacity-70"
                    title="Decoded Text"
                    >Aa</span
                  >
                  <div
                    id="decoded-live"
                    class="font-sans font-extrabold text-[17px] sm:text-[18px] tracking-tight text-[#f0f2f5] min-h-[22px] flex items-center"
                  ></div>
                </div>
              </div>

              <div class="flex items-center gap-3 shrink-0">
                <button
                  id="clear-btn"
                  aria-label="Clear buffer"
                  class="w-10 h-10 flex items-center justify-center text-[#717a89] hover:text-[#ff7878] active:scale-90 transition-all cursor-pointer"
                  title="Clear (Backspace)"
                >
                  <svg
                    class="w-5 h-5"
                    fill="none"
                    stroke="currentColor"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2.5"
                    viewBox="0 0 24 24"
                  >
                    <line x1="18" x2="6" y1="6" y2="18"></line>
                    <line x1="6" x2="18" y1="6" y2="18"></line>
                  </svg>
                </button>
                <button
                  id="send-btn"
                  aria-label="Transmit message"
                  class="relative w-12 h-12 flex items-center justify-center active:scale-95 transition-all cursor-pointer group"
                  title="Transmit now or auto-transmits"
                >
                  <svg
                    class="absolute inset-0 w-full h-full pointer-events-none -rotate-90"
                    viewBox="0 0 48 48"
                  >
                    <circle
                      id="send-timer-track"
                      class="opacity-0 transition-opacity duration-200"
                      cx="24"
                      cy="24"
                      fill="none"
                      r="20"
                      stroke="#ffffff"
                      stroke-opacity="0.2"
                      stroke-width="3.5"
                    ></circle>
                    <circle
                      id="send-timer-ring"
                      cx="24"
                      cy="24"
                      fill="none"
                      r="20"
                      stroke="#ffffff"
                      stroke-opacity="0.95"
                      stroke-dasharray="125.66"
                      stroke-dashoffset="125.66"
                      stroke-linecap="round"
                      stroke-width="3.5"
                    ></circle>
                  </svg>
                  <div
                    class="w-9 h-9 rounded-full bg-[#ffbe44] shadow-[0_2px_12px_rgba(255,190,68,0.4)] flex items-center justify-center z-10 transition-transform group-hover:scale-105 active:scale-95"
                    style="
                      background: linear-gradient(
                        135deg,
                        rgb(245, 211, 120) 0%,
                        rgb(229, 169, 60) 45%,
                        rgb(212, 160, 52) 80%,
                        rgb(201, 147, 40) 100%
                      );
                      box-shadow:
                        rgba(229, 169, 60, 0.45) 0px 2px 14px,
                        rgba(255, 255, 255, 0.4) 0px 1px 1px inset;
                    "
                  >
                    <svg
                      class="w-5 h-5 text-[#090a0d] group-hover:text-black transition-colors stroke-current"
                      fill="none"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="3"
                      viewBox="0 0 24 24"
                    >
                      <line x1="12" x2="12" y1="19" y2="5"></line>
                      <polyline points="5 12 12 5 19 12"></polyline>
                    </svg>
                  </div>
                </button>
              </div>
            </div>

            <!-- Full Straight Key SVG Apparatus -->
            <div
              id="telegraph-key-bed"
              class="w-full relative px-2 sm:px-6 pt-1 pb-3 flex items-center justify-center cursor-pointer select-none"
            >
              <div
                class="w-full h-[165px] sm:h-[180px] relative flex items-center justify-center"
              >
                <svg
                  id="telegraph-svg"
                  class="w-full h-full max-h-[180px] overflow-visible"
                  fill="none"
                  viewBox="0 0 920 220"
                  xmlns="http://www.w3.org/2000/svg"
                >
                  <defs>
                    <linearGradient id="slate-bed" x1="0" x2="0" y1="0" y2="1">
                      <stop
                        offset="0%"
                        stop-color="#181c24"
                        stop-opacity="0.75"
                      />
                      <stop
                        offset="40%"
                        stop-color="#101319"
                        stop-opacity="0.65"
                      />
                      <stop
                        offset="90%"
                        stop-color="#0a0c10"
                        stop-opacity="0.7"
                      />
                      <stop
                        offset="100%"
                        stop-color="#06080a"
                        stop-opacity="0.8"
                      />
                    </linearGradient>
                    <linearGradient
                      id="brass-lever-beam"
                      x1="160"
                      x2="820"
                      y1="110"
                      y2="110"
                      gradientUnits="userSpaceOnUse"
                    >
                      <stop offset="0%" stop-color="#7a5518" />
                      <stop offset="18%" stop-color="#c99328" />
                      <stop offset="38%" stop-color="#f5d378" />
                      <stop offset="55%" stop-color="#d4a034" />
                      <stop offset="80%" stop-color="#e5a93c" />
                      <stop offset="100%" stop-color="#8c621d" />
                    </linearGradient>
                    <linearGradient
                      id="brass-column"
                      x1="0"
                      x2="0"
                      y1="0"
                      y2="1"
                    >
                      <stop offset="0%" stop-color="#f5d378" />
                      <stop offset="28%" stop-color="#e5a93c" />
                      <stop offset="68%" stop-color="#c99328" />
                      <stop offset="100%" stop-color="#634410" />
                    </linearGradient>
                    <linearGradient
                      id="knurl-pattern"
                      x1="0"
                      x2="1"
                      y1="0"
                      y2="0"
                    >
                      <stop offset="0%" stop-color="#996f1b" />
                      <stop offset="25%" stop-color="#f5d378" />
                      <stop offset="50%" stop-color="#c99328" />
                      <stop offset="75%" stop-color="#fadc7d" />
                      <stop offset="100%" stop-color="#6e4d13" />
                    </linearGradient>
                    <radialGradient id="bakelite-top" cx="45%" cy="35%" r="65%">
                      <stop offset="0%" stop-color="#383c44" />
                      <stop offset="25%" stop-color="#1c1f24" />
                      <stop offset="70%" stop-color="#0c0e11" />
                      <stop offset="100%" stop-color="#030405" />
                    </radialGradient>
                    <radialGradient id="spark-glow" cx="50%" cy="50%" r="50%">
                      <stop offset="0%" stop-color="#ffffff" />
                      <stop offset="30%" stop-color="#ffe483" />
                      <stop
                        offset="70%"
                        stop-color="#e5a93c"
                        stop-opacity="0.9"
                      />
                      <stop
                        offset="100%"
                        stop-color="#d4a034"
                        stop-opacity="0"
                      />
                    </radialGradient>
                    <filter
                      id="drop-heavy"
                      x="-15%"
                      y="-15%"
                      width="130%"
                      height="145%"
                    >
                      <feDropShadow
                        dx="0"
                        dy="5"
                        stdDeviation="6"
                        flood-color="#000000"
                        flood-opacity="0.85"
                      />
                    </filter>
                  </defs>
                  <g filter="url(#drop-heavy)">
                    <rect
                      x="40"
                      y="30"
                      width="840"
                      height="155"
                      rx="8"
                      fill="#07080a"
                      stroke="#1d222b"
                      stroke-width="1.5"
                    />
                    <rect
                      x="45"
                      y="34"
